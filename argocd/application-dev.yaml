apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: lab5-dev
  namespace: argocd
spec:
  project: lab5
  source:
    repoURL: https://github.com/Ajithkumar-Sivakumar/argocd_demo.git
    targetRevision: main
    path: overlays/dev
  destination:
    server: https://kubernetes.default.svc
    namespace: lab5-dev
  syncPolicy:
    automated:
      enabled: true
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
    retry:
      limit: 3
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 1m
