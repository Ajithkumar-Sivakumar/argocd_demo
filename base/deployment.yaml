apiVersion: apps/v1
kind: Deployment
metadata:
  name: lab5-web
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  replicas: 1
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: lab5-web
  template:
    metadata:
      labels:
        app.kubernetes.io/name: lab5-web
    spec:
      automountServiceAccountToken: false
      containers:
        - name: web
          image: nginx:1.28.0
          imagePullPolicy: IfNotPresent
          command: ["/bin/sh", "-ec"]
          args:
            - |
              printf '<!doctype html><html><body><h1>Argo CD + Kustomize</h1><p>%s</p><p>Namespace: %s</p></body></html>\n' \
                "$APP_MESSAGE" "$POD_NAMESPACE" > /usr/share/nginx/html/index.html
              exec nginx -g 'daemon off;'
          env:
            - name: APP_MESSAGE
              valueFrom:
                configMapKeyRef:
                  name: lab5-config
                  key: APP_MESSAGE
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
          ports:
            - name: http
              containerPort: 80
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 2
            periodSeconds: 3
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 32Mi
            limits:
              cpu: 250m
              memory: 64Mi
